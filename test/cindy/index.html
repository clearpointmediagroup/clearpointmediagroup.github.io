<!DOCTYPE html>
<!--
  Cindy's Call Page (CC-183) - index.html
  v1.5-TEST (Nov 18, 2026, 2:22 AM ET)
  REVISION LOG
    v1.5-TEST (Nov 18, 2026, 2:22 AM ET) Randy 2:22 AM: each place opens with an Open button; opening it stamps
              "Opened" with the date and time. The Log at the bottom of each record shows every stamp (Opened, Called,
              Saved) with date and time; the Saved line also shows what she filled in. Stamps go to the script at once.
    v1.4-TEST (Nov 18, 2026, 2:17 AM ET) Randy 2:17 AM: a Call log at the bottom of each place shows every time she
              tapped Call (date and time), newest first; Save adds a "Saved" line. Each Call tap is also sent to the
              script right away (action 'called'), so a call is logged even if she never taps Save.
    v1.3-TEST (Nov 18, 2026, 2:14 AM ET) Randy 2:14 AM: title is now a drop-down with more titles (Owner, Co-owner,
              General manager, Manager, Social media / marketing, Admin / office, Front desk / staff, Other).
    v1.2-TEST (Nov 18, 2026, 2:06 AM ET) Randy 2:05-2:06 AM: "Who did you talk to?" name box plus tap buttons for the
              title (Owner, Manager, Admin / office, Other); phone box now "Decision maker's phone (or another number)";
              tapping Call logs the date and time she called (shown on the row and on Done, sent as calledAt).
    v1.1-TEST (Nov 18, 2026, 2:04 AM ET) Randy 2:04 AM: added a box for the manager's phone or another phone number
              (under the email box); shown on Done and sent to the script as extraPhone.
    v1.0-TEST (Nov 18, 2026, 1:52 AM ET) First version. PIN screen; To call / Done lists; Call button (tel: link);
              form per row (owner or manager name, direct email, best time to call, note); Save sends to the
              CPMG_CindyCalls Apps Script (never to GitHub). No call list is stored in this page: it loads from the
              script only after the PIN. ?demo=1 shows made-up practice rows and saves nothing.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cindy's Call Page - ClearPoint Media Group</title>
<link rel="icon" href="../../assets/cpmg-icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="../../assets/cpmg-order.css?v=1.1">
<style>
/* Fallback copy of the order-form colors, so the page looks right even if the shared file is slow */
:root{--bg:#0f1712;--card:#18221d;--fg:#e4ede8;--muted:#9fb3a7;--line:#2a3a31;--green:#5fc48c;--deep:#1d2b24;--amber:#fac775;--err:#f4a6a6;--ink:#0c130f;--display:"Archivo",Arial,sans-serif;--body:"Source Sans 3","Segoe UI",Arial,sans-serif;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:18px;margin:0}
*{box-sizing:border-box}
[hidden]{display:none!important}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 60px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:50%;background:var(--deep);border:2px solid var(--green);display:flex;align-items:center;justify-content:center;font:800 15px var(--display);color:var(--green);flex:none}
h1{font:800 24px var(--display);margin:0;color:var(--fg)}
.sub{font-size:15px;color:var(--muted);margin:0}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
.card.g{border-color:var(--green)}
.stack{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
label{font-weight:700;font-size:17px}
input[type=text],input[type=email],input[type=tel],textarea{font:inherit;font-size:18px;color:var(--fg);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;-webkit-appearance:none;appearance:none}
textarea{min-height:90px;resize:vertical}
select{font:inherit;font-size:18px;color:var(--fg);background-color:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px 40px 12px 14px;width:100%;-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,#5fc48c 50%),linear-gradient(135deg,#5fc48c 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 14px) 55%;background-size:6px 6px,6px 6px;background-repeat:no-repeat}
select:focus{outline:none;border-color:var(--green)}
input:focus,textarea:focus{outline:none;border-color:var(--green)}
.big{display:flex;align-items:center;justify-content:center;width:100%;font:800 22px var(--display);background:var(--green);color:var(--ink);border:0;border-radius:14px;padding:16px;cursor:pointer;min-height:56px}
.big[disabled]{opacity:.75;cursor:wait}
.test{background:#412402;border:2px solid var(--amber);color:var(--amber);border-radius:12px;padding:8px 12px;font-weight:700;text-align:center}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tabs button{font:800 19px var(--display);border:3px solid var(--green);border-radius:14px;background:#10301d;color:#fff;padding:14px 8px;cursor:pointer}
.tabs button.on{background:var(--green);color:var(--ink)}
.who{display:flex;flex-direction:column;gap:4px}
.who .nm{font:800 21px var(--display)}
.who .why{display:inline-block;align-self:flex-start;border:2px solid var(--green);color:var(--green);border-radius:999px;padding:2px 10px;font-weight:700;font-size:15px}
.who .why.reply{border-color:var(--amber);color:var(--amber)}
.who .meta{font-size:16px;color:var(--muted)}
a.callbtn{display:flex;align-items:center;justify-content:center;gap:10px;font:800 22px var(--display);background:var(--green);color:var(--ink);border-radius:14px;padding:16px;text-decoration:none;min-height:56px}
.savebtn{font:800 20px var(--display);background:#10301d;color:#fff;border:3px solid var(--green);border-radius:14px;padding:14px;cursor:pointer;width:100%}
.savebtn[disabled]{opacity:.6;cursor:wait}
.msg{font-size:16px;margin:0}
.msg.ok{color:var(--green)}.msg.bad{color:var(--err)}
.donebox{font-size:16px;color:var(--fg);background:var(--deep);border-radius:10px;padding:10px 12px;line-height:1.5}
.empty{text-align:center;color:var(--muted);font-size:18px;padding:20px 0}
.taps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.taps button{font:700 18px var(--body);background:var(--bg);color:var(--fg);border:2px solid var(--line);border-radius:12px;padding:12px 6px;min-height:52px;cursor:pointer}
.taps button.on{border:3px solid var(--green);background:var(--deep);color:var(--green)}
.clog{border-top:2px solid var(--line);padding-top:10px;margin:0}
.clog h4{font:800 16px var(--display);color:var(--green);margin:0 0 6px;letter-spacing:.04em;text-transform:uppercase}
.clog div{font-size:16px;padding:3px 0;color:var(--fg)}
.clog .none{color:var(--muted)}
.clog .lw{color:var(--muted);font-size:15px}
.foot{font-size:14px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="logo">CP</div><div><h1>Cindy's Call Page</h1><p class="sub">ClearPoint Media Group</p></div></div>
  <div id="testBar" class="test" hidden>TEST COPY · practice rows only · nothing real is saved</div>

  <!-- PIN screen -->
  <div id="pinCard" class="card g">
    <label for="pin">Type your PIN</label>
    <input id="pin" type="tel" inputmode="numeric" autocomplete="off" maxlength="12">
    <button class="big" id="pinGo" type="button">Open my list</button>
    <p class="msg bad" id="pinMsg"></p>
  </div>

  <!-- Lists -->
  <div id="listArea" hidden>
    <div class="tabs"><button id="tTo" class="on" type="button">To call (<span id="nTo">0</span>)</button><button id="tDone" type="button">Done (<span id="nDone">0</span>)</button></div>
    <p class="sub" id="asOf" style="text-align:center;margin-top:10px"></p>
    <div id="toList" class="stack" style="margin-top:12px"></div>
    <div id="doneList" class="stack" style="margin-top:12px" hidden></div>
  </div>

  <div class="foot">Cindy's Call Page v1.5-TEST · Nov 18, 2026, 2:22 AM Eastern</div>
</div>

<script>
/* ===== Settings ===== */
var SCRIPT_URL = '';   // TEST Apps Script web app address goes here (CPMG_CindyCalls.gs). Empty = demo only.
var DEMO = /[?&]demo=1/.test(location.search) || !SCRIPT_URL;

var TITLES = ['Owner','Co-owner','General manager','Manager','Social media / marketing','Admin / office','Front desk / staff','Other'];
var PIN = '', DATA = {asOf:'', toCall:[], done:[]};

function el(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function telHref(p){var d=String(p||'').replace(/[^0-9+]/g,''); if(/^\d{10}$/.test(d)) d='+1'+d; return 'tel:'+d}
function nowET(){return new Date().toLocaleString('en-US',{timeZone:'America/New_York',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+' ET'}
function okEmail(s){return !s || /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(s)}

/* ===== Practice rows for the test look (made-up places, Randy's own test number) ===== */
function demoData(){
  return {asOf:'TEST practice list', toCall:[
    {id:'P1',business:'PRACTICE - Cindy',town:'Myrtle Beach, SC',phone:'(843) 321-9518',why:'Replied',detail:'Wrote back: "Sounds good, call me"',theirTime:'Eastern'},
    {id:'P2',business:'Practice Pizza Shack',town:'Frisco, CO',phone:'(843) 321-9518',why:'Clicked',detail:'Clicked the sample link twice',theirTime:'Mountain (2 hours behind you)'},
    {id:'P3',business:'Practice Mountain Cafe',town:'Salida, CO',phone:'(843) 321-9518',why:'Opened 3 times',detail:'Opened the email 3 times',theirTime:'Mountain (2 hours behind you)'}
  ], done:[]};
}

/* ===== Talk to the Apps Script ===== */
function apiGet(params){
  var q=Object.keys(params).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(params[k])}).join('&');
  return fetch(SCRIPT_URL+'?'+q,{method:'GET',redirect:'follow'}).then(function(r){return r.json()});
}
function apiPost(body){
  // text/plain keeps it a "simple" request (no CORS preflight) for Apps Script
  return fetch(SCRIPT_URL,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}).then(function(r){return r.json()});
}

/* ===== PIN ===== */
el('pinGo').onclick=function(){
  var p=el('pin').value.trim(); el('pinMsg').textContent='';
  if(DEMO){PIN=p||'demo'; DATA=demoData(); show(); return}
  if(!p){el('pinMsg').textContent='Type your PIN first.';return}
  el('pinGo').disabled=true; el('pinGo').textContent='Opening...';
  apiGet({action:'list',pin:p}).then(function(r){
    if(!r||!r.ok){el('pinMsg').textContent=(r&&r.error)||'That PIN did not work.';return}
    PIN=p; DATA=r; show();
  }).catch(function(){el('pinMsg').textContent='Could not reach the list. Check the internet and try again.'})
  .finally(function(){el('pinGo').disabled=false; el('pinGo').textContent='Open my list'});
};
el('pin').addEventListener('keydown',function(e){if(e.key==='Enter')el('pinGo').click()});

/* ===== Lists ===== */
function show(){
  el('pinCard').hidden=true; el('listArea').hidden=false; el('testBar').hidden=!DEMO;
  el('asOf').textContent=DATA.asOf?('List made '+DATA.asOf):'';
  render();
}
el('tTo').onclick=function(){tab(true)}; el('tDone').onclick=function(){tab(false)};
function tab(to){el('tTo').classList.toggle('on',to);el('tDone').classList.toggle('on',!to);el('toList').hidden=!to;el('doneList').hidden=to}

function render(){
  el('nTo').textContent=DATA.toCall.length; el('nDone').textContent=DATA.done.length;
  el('toList').innerHTML = DATA.toCall.length ? DATA.toCall.map(rowHtml).join('') : '<div class="empty">Nobody left to call. Nice work!</div>';
  el('doneList').innerHTML = DATA.done.length ? DATA.done.map(doneHtml).join('') : '<div class="empty">No calls saved yet.</div>';
  DATA.toCall.forEach(function(r){
    var o=el('open_'+r.id); if(o) o.onclick=function(){ openRow(r) };
    var b=el('save_'+r.id); if(b) b.onclick=function(){save(r)};
    var c=el('call_'+r.id); if(c) c.addEventListener('click',function(){ stamp(r,'Called') });
  });
}

/* Every stamp (Opened, Called, Saved) goes in the record's log with the date and time */
function stamp(r,kind,extra){
  var t=nowET(); r.log=(r.log||[]); r.log.unshift({kind:kind,at:t,what:extra||''});
  var lg=el('log_'+r.id); if(lg) lg.innerHTML=logHtml(r.log);
  if(!DEMO && kind!=='Saved') apiPost({action:'stamp',kind:kind,pin:PIN,id:r.id,at:t}).catch(function(){});
  return t;
}
function openRow(r){
  var body=el('body_'+r.id), o=el('open_'+r.id);
  if(body.hidden){ body.hidden=false; o.textContent='Close'; stamp(r,'Opened'); }
  else { body.hidden=true; o.textContent='Open'; }
}

function rowHtml(r){
  var id=esc(r.id);
  return '<div class="card g">'+
    '<div class="who"><span class="why'+(/repl/i.test(r.why)?' reply':'')+'">'+esc(r.why)+'</span>'+
    '<span class="nm">'+esc(r.business)+'</span>'+
    '<span class="meta">'+esc(r.town)+' · '+esc(r.phone)+'</span>'+
    (r.detail?'<span class="meta">'+esc(r.detail)+'</span>':'')+
    (r.theirTime?'<span class="meta">Their time: '+esc(r.theirTime)+'</span>':'')+'</div>'+
    '<button class="savebtn" type="button" id="open_'+id+'">Open</button>'+
    '<div class="stack" id="body_'+id+'" hidden>'+
    '<a class="callbtn" id="call_'+id+'" href="'+esc(telHref(r.phone))+'">&#128222; Call</a>'+
    '<div class="field"><label for="nm_'+id+'">Who did you talk to?</label><input type="text" id="nm_'+id+'" autocomplete="off" placeholder="Their name"></div>'+
    '<div class="field"><label for="tt_'+id+'">Their title</label><select id="tt_'+id+'"><option value="">Pick one</option>'+
      TITLES.map(function(t){return '<option>'+esc(t)+'</option>'}).join('')+'</select></div>'+
    '<div class="field"><label for="em_'+id+'">Their direct email</label><input type="email" id="em_'+id+'" autocomplete="off" inputmode="email"></div>'+
    '<div class="field"><label for="ph_'+id+'">Decision maker\'s phone (or another number)</label><input type="tel" id="ph_'+id+'" autocomplete="off" inputmode="tel" placeholder="(555) 555-1234"></div>'+
    '<div class="field"><label for="bt_'+id+'">Best time to call</label><input type="text" id="bt_'+id+'" autocomplete="off" placeholder="Example: weekdays after 2"></div>'+
    '<div class="field"><label for="nt_'+id+'">Note</label><textarea id="nt_'+id+'"></textarea></div>'+
    '<button class="big" type="button" id="save_'+id+'">Save this call</button>'+
    '<p class="msg" id="msg_'+id+'"></p></div>'+
    '<div class="clog" id="log_'+id+'">'+logHtml(r.log||[])+'</div></div>';
}
var ICON={Opened:'&#128194;',Called:'&#128222;',Saved:'&#9989;'};
function logHtml(log){
  var rows=(log||[]).map(function(x){return '<div>'+(ICON[x.kind]||'&#8226;')+' <b>'+esc(x.kind)+'</b> '+esc(x.at)+(x.what?'<br><span class="lw">'+esc(x.what)+'</span>':'')+'</div>'});
  return '<h4>Log</h4>'+(rows.length?rows.join(''):'<div class="none">Nothing yet. Tap Open to start.</div>');
}
function doneHtml(r){
  return '<div class="card"><div class="who"><span class="nm">'+esc(r.business)+'</span><span class="meta">'+esc(r.town||'')+(r.phone?' · '+esc(r.phone):'')+'</span></div>'+
    '<div class="clog">'+logHtml(r.log||[])+'</div></div>';
}
function summary(f){
  var a=[];
  if(f.contactName||f.contactTitle) a.push('Talked to: '+f.contactName+(f.contactTitle?' ('+f.contactTitle+')':''));
  if(f.contactEmail) a.push('Email: '+f.contactEmail);
  if(f.extraPhone) a.push('Other phone: '+f.extraPhone);
  if(f.bestTime) a.push('Best time: '+f.bestTime);
  if(f.note) a.push('Note: '+f.note);
  return a.join(' · ');
}

/* ===== Save ===== */
function save(r){
  var f={contactTitle:el('tt_'+r.id).value, contactName:el('nm_'+r.id).value.trim(), contactEmail:el('em_'+r.id).value.trim(), extraPhone:el('ph_'+r.id).value.trim(),
         bestTime:el('bt_'+r.id).value.trim(), note:el('nt_'+r.id).value.trim()};
  var m=el('msg_'+r.id); m.className='msg';
  if(!okEmail(f.contactEmail)){m.className='msg bad';m.textContent='That email does not look right. Check it and tap Save again.';return}
  if(f.extraPhone && String(f.extraPhone).replace(/\D/g,'').length<10){m.className='msg bad';m.textContent='That phone number looks short. It needs 10 digits.';return}
  if(!f.contactName && !f.contactTitle && !f.contactEmail && !f.extraPhone && !f.bestTime && !f.note){m.className='msg bad';m.textContent='Fill in at least one box first.';return}
  f.log=(r.log||[]).map(function(x){return x.kind+' '+x.at}).join(' | ');
  var b=el('save_'+r.id); b.disabled=true; b.textContent='Saving...';
  var done=function(savedAt){
    r.log=(r.log||[]); r.log.unshift({kind:'Saved',at:savedAt,what:summary(f)});
    DATA.toCall=DATA.toCall.filter(function(x){return x.id!==r.id});
    DATA.done.unshift({business:r.business,town:r.town,phone:r.phone,log:r.log.slice()}); render();
  };
  if(DEMO){setTimeout(function(){done(nowET()+' (test only, not saved)')},400);return}
  apiPost({action:'save',pin:PIN,id:r.id,fields:f}).then(function(res){
    if(!res||!res.ok){throw new Error((res&&res.error)||'Save failed')}
    done(res.savedAt||nowET());
  }).catch(function(e){b.disabled=false;b.textContent='Save this call';m.className='msg bad';m.textContent='Not saved: '+e.message+'. Your typing is still here. Tap Save again.'});
}
</script>
</body>
</html>
