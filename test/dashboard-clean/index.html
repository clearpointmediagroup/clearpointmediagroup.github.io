<!DOCTYPE html>
<html>
<head>
<title>TEST CPMG Dashboard</title>
<link rel="icon" href="../../assets/cpmg-icon-192.png">
<link rel="apple-touch-icon" href="../../assets/cpmg-icon-180.png">
<meta name="theme-color" content="#0f1712">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{--bg:#0f1712;--surface:#17221c;--box:#173404;--fg:#c9e6b0;--strong:#dff0c8;--muted:#9fc47c;--line:#2f4a24;
  --green:#97c459;--amber:#fac775;--amber-bg:#412402;--red:#f4a6a6;--red-bg:#4a1717;
  --display:"Archivo",Arial,sans-serif;--body:"Source Sans 3","Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:20px;line-height:1.45}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
h1{font-family:var(--display);font-size:32px;margin:0;color:var(--strong)}
h2{font-family:var(--display);font-size:24px;margin:0;color:var(--strong)}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}
.sub{font-size:16px;color:var(--muted)}
button{font:700 20px var(--body);border-radius:999px;border:0;padding:14px 22px;cursor:pointer}
button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.btn{background:var(--green);color:var(--bg)}
.btn2{background:transparent;color:var(--green);border:2px solid var(--green)}
.btnwarn{background:var(--amber-bg);color:var(--amber);border:2px solid var(--amber)}
.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.stage{background:var(--box);border:2px solid var(--green);border-radius:14px;padding:18px;display:flex;align-items:center;gap:16px;cursor:pointer;text-align:left;width:100%;color:var(--fg);font:inherit}
.stage.mine{border:3px solid var(--amber)}
.stage.empty{opacity:.45}
.stages{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.clHead.bad{border-color:var(--red);background:var(--red-bg)}
.foldBody{margin-top:12px}
body.tv #pagesFold,body.tv #salesFold,body.tv #sysFold{display:none!important}
.count{font:700 44px var(--display);color:var(--strong);min-width:64px;text-align:center}
.stage .lbl{font:700 24px var(--display);color:var(--strong)}
.stage .nt{font-size:17px;color:var(--muted)}
.tag{display:inline-block;font-size:14px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--amber);border:1.5px solid var(--amber);border-radius:999px;padding:0 9px;margin-top:4px}
.list{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.job{background:var(--box);border:2px solid var(--green);border-radius:14px;padding:16px;cursor:pointer;text-align:left;width:100%;color:var(--fg);font:inherit}
.job.kicked{background:var(--red-bg);border-color:var(--red)}
.job b{font:700 22px var(--display);color:var(--strong);display:block}
.job .m{font-size:17px;color:var(--muted)}
.job .k{font-size:17px;color:var(--red);font-weight:700}
.empty{border:2px dashed var(--line);border-radius:14px;padding:20px;text-align:center;color:var(--muted)}
.card{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.imgs{display:flex;flex-direction:column;gap:14px}
.imgs figure{margin:0;background:#000;border-radius:12px;padding:10px;text-align:center}
.imgs img{max-width:100%;max-height:70vh;border-radius:8px}
.imgs figcaption{font-size:15px;color:var(--muted);margin-top:6px;word-break:break-all}
dl{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;margin:0}
dt{font-size:15px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding-top:3px}
dd{margin:0;white-space:pre-line;word-break:break-word}
.notes{white-space:pre-line;font-size:17px}
.acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}
.warn{background:var(--amber-bg);border:2px solid var(--amber);color:var(--amber);border-radius:12px;padding:12px 14px;margin-top:14px;font-weight:600}
.err{background:var(--red-bg);border:2px solid var(--red);color:var(--red);border-radius:12px;padding:12px 14px;margin-top:14px;font-weight:600}
textarea,input{width:100%;font:20px var(--body);padding:12px;border-radius:10px;border:2px solid var(--green);background:var(--bg);color:var(--strong);margin-top:8px}
.full{position:fixed;inset:0;background:#000;z-index:10;display:flex;flex-direction:column}
.full img{flex:1;min-height:0;width:100%;object-fit:contain}
.full .bar{display:flex;justify-content:center;gap:12px;padding:12px;background:#000}
.hide{display:none!important}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:12px}
.lk{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 16px;color:var(--fg);text-decoration:none}
.lk:hover{border-color:var(--green)}
.lk b{font:700 21px var(--display);color:var(--strong)}
.lk span{font-size:16px;color:var(--muted)}
.lgrp{font:700 15px var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--green);margin-top:22px}
.signin{max-width:440px;margin:8vh auto 0;display:flex;flex-direction:column;gap:16px}
.signLogo{width:120px;height:120px;border-radius:24px;margin:0 auto;display:block}
.signin h1{text-align:center}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:22px}
.mbox{background:var(--box);border:2px solid var(--green);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.mbox h3{margin:0;font:700 22px var(--display);color:var(--strong)}
.mnums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mn{background:var(--bg);border-radius:10px;padding:8px 10px;min-width:0}
.mn b{display:block;font:700 30px var(--display);color:var(--strong);font-variant-numeric:tabular-nums;line-height:1.1}
.mn span{font-size:16px;color:var(--muted)}
.mn.warn b{color:var(--amber)}
.mline{font-size:17px;color:var(--muted);overflow-wrap:anywhere}
.mline b{color:var(--fg)}
.mbox details summary{cursor:pointer;color:var(--green);font-weight:700;font-size:17px}
.mbox ul{margin:8px 0 0;padding-left:20px;font-size:17px;color:var(--fg)}
.mbox .merr{color:var(--amber);font-size:17px}
body.tv .mgrid,body.tv #pagesHead,body.tv #pagesNote,body.tv #links{display:none}
button.mn{border:0;text-align:left;cursor:pointer;color:inherit;font:inherit;width:100%;position:relative;box-shadow:inset 0 0 0 1px var(--line)}
button.mn::after{content:"›";position:absolute;right:10px;top:8px;font-size:22px;color:var(--green)}
button.mn:active,.mi:active{transform:scale(.98)}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:var(--bg);border:0;border-radius:10px;padding:10px 12px;margin-top:6px;color:var(--fg);font:inherit;font-size:17px;cursor:pointer;text-align:left}
.mrow b{color:var(--strong)}
.mi{background:var(--box);border:2px solid var(--green);border-radius:14px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.mi b{font-size:20px;color:var(--strong);overflow-wrap:anywhere}
.mi .m{color:var(--muted);font-size:16px;overflow-wrap:anywhere}
.mi .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.mi .acts a,.rec a{color:var(--green);font-weight:700;text-decoration:underline;overflow-wrap:anywhere}
.rec dl{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;margin:0}
.rec dt{color:var(--muted);font-size:15px;margin-top:10px}
.rec dd{margin:0;font-size:19px;color:var(--fg);overflow-wrap:anywhere;white-space:pre-wrap}
.lb{display:inline-block;padding:7px 14px;border-radius:999px;border:2px solid var(--green);color:var(--green)!important;font-weight:700;text-decoration:none!important;font-size:16px}
.lbs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
#areaPick{font:18px var(--body);padding:10px 12px;border-radius:10px;border:2px solid var(--green);background:var(--box);color:var(--strong);width:100%;margin-top:10px}
.whos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.whoBtn{font-size:22px;padding:16px}
.whoBtn.on{background:var(--green);color:var(--bg)}
#pin{font:700 28px var(--body);letter-spacing:.3em;padding:12px 14px;border-radius:12px;border:2px solid var(--green);background:var(--surface);color:var(--strong);width:100%;box-sizing:border-box}
.pinwrap{position:relative}
.pinwrap #pin{padding-right:64px}
.eyeBtn{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:48px;height:48px;border:0;background:transparent;color:var(--green);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.eyeBtn svg{width:30px;height:30px}
.rem{display:flex;gap:10px;align-items:center;font-size:18px;color:var(--muted)}
.rem input{width:22px;height:22px}
.tan{background:#3a2a10;border:1.5px solid var(--amber);border-radius:8px;padding:6px 10px;color:var(--amber);font-weight:700;word-break:break-all}
/* v1.1 LIVE bar + version line */
.livebar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 16px;margin-bottom:14px}
.live{display:flex;align-items:center;gap:12px;font:700 22px var(--display);color:var(--green)}
.dot{width:20px;height:20px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);flex:none;animation:blink 1.6s ease-in-out infinite}
.live.stale{color:var(--amber)}
.live.stale .dot{background:var(--amber);box-shadow:0 0 10px var(--amber);animation:none}
.livebar.stale{background:var(--amber-bg);border-color:var(--amber)}
.ver{font-size:16px;font-weight:600;color:var(--muted);overflow-wrap:anywhere}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.stage{min-width:0}
.stage .lbl,.stage .nt{overflow-wrap:anywhere}
/* v1.1 sideways view (laptop / TV): six boxes in one row, big type */
@media (min-width:900px) and (orientation:landscape){
  .wrap{max-width:none;padding:18px 2vw 40px}
  h1{font-size:clamp(32px,2.6vw,60px)}
  .sub{font-size:clamp(16px,1.2vw,28px)}
  .live{font-size:clamp(22px,1.8vw,42px)}
  .dot{width:clamp(20px,1.6vw,38px);height:clamp(20px,1.6vw,38px)}
  .ver{font-size:clamp(16px,1.1vw,26px)}
  .stages{grid-template-columns:repeat(6,minmax(0,1fr));gap:1.2vw}
  .stage{flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;gap:.6vw;padding:1.4vw 0.8vw}
  .count{font-size:clamp(48px,6vw,140px);min-width:0;line-height:1}
  .stage .lbl{font-size:clamp(20px,1.8vw,42px);line-height:1.15}
  .stage .nt{font-size:clamp(15px,1.15vw,26px)}
  .tag{font-size:clamp(14px,1vw,22px)}
}
@media (max-width:520px){dl{grid-template-columns:1fr}dt{padding-top:8px}h1{font-size:28px}}
/* v2.6 loading bar: green track, fill grows left to right, light sweeps across */
.ldbar{position:relative;height:14px;border-radius:999px;background:var(--box);border:1.5px solid var(--green);overflow:hidden;margin:6px 0 14px}
.ldbar .lf{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--green);opacity:.55;animation:ldfill 12s cubic-bezier(.08,.6,.25,1) forwards}
.ldbar .ls{position:absolute;top:0;bottom:0;left:-40%;width:40%;background:linear-gradient(90deg,rgba(223,240,200,0),rgba(223,240,200,.9),rgba(223,240,200,0));animation:ldshine 1.3s linear infinite}
.ldtext{font:700 18px var(--body);color:var(--green);margin-top:6px}
@keyframes ldfill{0%{width:0}100%{width:94%}}
@keyframes ldshine{0%{left:-40%}100%{left:100%}}
@media (prefers-reduced-motion:reduce){.ldbar .ls{animation-duration:3s}}
/* v2.7 Clients box (folded up) */
.cl{margin-top:22px}
.clHead{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--box);border:2px solid var(--green);border-radius:14px;padding:16px 18px;color:var(--strong);font:700 24px var(--display);cursor:pointer;text-align:left}
.clHead .cc{font:600 17px var(--body);color:var(--muted)}
.clHead .ca{font:700 17px var(--body);color:var(--green);white-space:nowrap}
.clTiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:12px}
.clTile{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--fg);font:inherit;text-align:left;cursor:pointer}
.clTile b{display:block;font:700 30px var(--display);color:var(--strong)}
.clTile span{font-size:16px;color:var(--muted)}
.clTile.on{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber) inset}
.clCard{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:10px}
.clCard summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
.clCard summary::-webkit-details-marker{display:none}
.clCard summary b{font:700 21px var(--display);color:var(--strong);overflow-wrap:anywhere}
.clCard a{color:var(--amber)}
.chip{font-size:14px;font-weight:700;border-radius:999px;padding:2px 10px;border:1.5px solid currentColor;white-space:nowrap}
.h-new{color:#8fbbe8}.h-active{color:var(--green)}.h-check{color:var(--amber)}.h-slip{color:var(--red)}.h-lost{color:var(--muted)}
/* v2.7 TV view: sideways = only the six order boxes */
#tvBtn{display:none;font-size:16px;padding:6px 14px}
@media (orientation:landscape) and (min-width:640px){
  #tvBtn{display:inline-block}
  body.tv .top,body.tv #msg,body.tv #pagesHead,body.tv #links,body.tv #clients,body.tv #loading,body.tv .ver{display:none!important}
  body.tv .wrap{max-width:none;padding:1.2vh 1.5vw}
  body.tv .livebar{padding:.5vh 1.2vw;margin-bottom:1.2vh}
  body.tv .live{font-size:min(3.2vh,2vw)}
  body.tv .stages{grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:1fr;height:calc(100vh - 11vh);gap:1.4vw}
  body.tv .stage{flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:1vh;padding:1vh 1vw}
  body.tv .count{font-size:min(16vh,10vw);line-height:1;min-width:0}
  body.tv .stage .lbl{font-size:min(5.5vh,3.2vw);line-height:1.15}
  body.tv .stage .nt{display:none}
  body.tv .tag{font-size:min(2.8vh,1.7vw)}
}
</style>
</head>
<body>
<div style="position:sticky;top:0;z-index:9999;background:#9a3412;color:#fff;font:700 20px/1.3 system-ui,sans-serif;text-align:center;padding:10px 8px;letter-spacing:.04em">TEST COPY · cleaner layout · real order data</div>
<div class="wrap signin hide" id="signin">
  <img class="signLogo" src="../../assets/cpmg-icon-192.png" alt="CPMG">
  <h1>CPMG Dashboard</h1>
  <div class="sub" id="signSub">Type the PIN to sign in.</div>
  <div class="whos hide" id="whoStep"><button type="button" class="btn2 whoBtn" data-who="randy">Randy</button><button type="button" class="btn2 whoBtn" data-who="cindy">Cindy</button></div>
  <label for="pin" class="sub" id="pinLbl">PIN</label>
  <div class="pinwrap" id="pinWrap"><input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="10"><button type="button" class="eyeBtn" id="eyeBtn" aria-label="Show PIN" title="Show PIN"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/><line id="eyeSlash" x1="3" y1="3" x2="21" y2="21"/></svg></button></div>
  <script>(function(){var b=document.getElementById('eyeBtn'),p=document.getElementById('pin'),s=document.getElementById('eyeSlash'),held=false,timer=null,longPress=false;function set(show){p.type=show?'text':'password';s.style.display=show?'none':'';b.setAttribute('aria-label',show?'Hide PIN':'Show PIN');b.title=show?'Hide PIN':'Show PIN';}b.addEventListener('pointerdown',function(ev){ev.preventDefault();longPress=false;timer=setTimeout(function(){longPress=true;held=true;set(true);},250);});function up(){clearTimeout(timer);if(held){held=false;set(false);}}b.addEventListener('pointerup',up);b.addEventListener('pointerleave',up);b.addEventListener('pointercancel',up);b.addEventListener('contextmenu',function(ev){ev.preventDefault();});b.addEventListener('click',function(){if(longPress){longPress=false;return;}set(p.type==='password');});})();</script>
  <label class="rem"><input type="checkbox" id="remember"> Remember me on this phone (only on your own phone)</label>
  <button type="button" class="btn" id="signinBtn" style="font-size:22px;padding:14px">Sign in</button>
  <div id="signinLoad" class="hide"><div class="ldtext">Signing in…</div><div class="ldbar" aria-hidden="true"><span class="lf"></span><span class="ls"></span></div></div>
  <div id="signinMsg"></div>
</div>
<div class="wrap hide" id="dash">
  <div class="livebar" id="livebar">
    <div class="live" id="live"><span class="dot" aria-hidden="true"></span><span id="liveText" aria-live="polite">Connecting…</span></div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><div class="ver" id="ver"></div><button type="button" class="btn2" id="tvBtn">Show menus</button></div>
  </div>
  <div class="top">
    <div><h1>CPMG Dashboard</h1><div class="sub" id="sub">Loading…</div></div>
