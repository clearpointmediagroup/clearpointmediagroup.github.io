<script>
{
const $=id=>document.getElementById(id),PK='cam_pw_v1';
const P=JSON.parse($('payload').textContent);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
 const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
 const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.ct));
 return new TextDecoder().decode(plain);
}
function show(html){document.open();document.write(html);document.close();}
try{localStorage.removeItem(PK)}catch(e){}
const msg=$('msg'),go=$('go');
if(!(window.crypto&&crypto.subtle)){msg.textContent='This browser is too old to open the form. Try Chrome or Safari, or text Dad.';go.disabled=true;}
$('eye').addEventListener('click',()=>{const p=$('pw');const hid=p.type==='password';p.type=hid?'text':'password';$('eye').textContent=hid?'Hide':'Show';});
$('f').addEventListener('submit',async e=>{e.preventDefault();const pw=$('pw').value.trim();
 if(!pw){msg.textContent='Type the password first.';return;}
 go.disabled=true;go.textContent='Opening…';msg.textContent='';
 try{const html=await open(pw);show(html);}
 catch(err){go.disabled=false;go.textContent='Open the form';msg.textContent='That password is not right. Check it with Dad and try again.';$('pw').select();}});
}
</script>
