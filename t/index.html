<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ClearPoint Media Group</title>
<!--
  CPMG click page for the CRM Call Tracker emails - v1.0 (Nov 6, 2026)
  A link in a CPMG tracker email opens this page. It quietly tells the sender script which email and which link,
  then opens the real page right away. The places it can open are fixed below (DEST), so nobody can use it to
  send people anywhere else. (The mail merge keeps its own page, /go/. This one is separate on purpose.)
  REVISION LOG
    v1.0 (Nov 6, 2026) First version: web, order, instagram, facebook. Also sends a few robot clues (browser
                       says it is automated, screen size) so the tracker can tell robot clicks from people.
-->
<style>
body{font-family:Arial,Helvetica,sans-serif;text-align:center;padding:48px 16px;color:#1d2733;background:#f2f7f3}
a{display:inline-block;background:#1f7a43;color:#ffffff;padding:14px 26px;border-radius:6px;text-decoration:none;font-weight:bold;font-size:18px}
</style>
</head>
<body>
<p style="font-size:18px">Opening ClearPoint Media Group...</p>
<p><a id="go" href="https://clearpointmediagroup.github.io/order/">Tap here to continue</a></p>
<script>
(function () {
  var DEST = {
    web: 'https://sites.google.com/cpmgdata.com/cpmg',
    order: 'https://clearpointmediagroup.github.io/order/',
    instagram: 'https://www.instagram.com/clearpointmediagroup/',
    facebook: 'https://www.facebook.com/profile.php?id=61595065748576'
  };
  var EXEC = 'https://script.google.com/macros/s/AKfycbxWwbF0eQa_ebYCedk1xFJjxl_oKPHLng6CJLI0ZejFHACcOQ5Qy2AjKzsqwgj60sYb/exec';
  var q = new URLSearchParams(location.search);
  var k = q.get('k') || 'order';
  var dest = DEST[k] || DEST.order;
  document.getElementById('go').href = dest;
  var gone = false;
  function go() { if (gone) return; gone = true; location.replace(dest); }
  try {
    var i = q.get('i');
    if (i && window.fetch && EXEC.indexOf('http') === 0) {
      var ua = navigator.userAgent || '';
      var bot = /Headless|PhantomJS|bot\b|crawl|spider|preview|Slurp|Lighthouse/i.test(ua) ? '1' : '0';
      var u = EXEC + '?x=1&i=' + encodeURIComponent(i) + '&lk=' + encodeURIComponent(k) +
              '&wd=' + (navigator.webdriver ? '1' : '0') + '&bt=' + bot +
              '&w=' + (screen.width || 0) + '&h=' + (screen.height || 0);
      fetch(u, { mode: 'no-cors', credentials: 'omit', keepalive: true }).then(go, go);
      setTimeout(go, 1500);
      return;
    }
  } catch (e) { /* counting failed; still open the page */ }
  go();
})();
</script>
<noscript><p><a href="https://clearpointmediagroup.github.io/order/">Tap here to continue</a></p></noscript>
</body>
</html>
