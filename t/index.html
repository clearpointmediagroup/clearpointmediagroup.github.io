<!doctype html>
<!-- CPMG click page (LIVE, /t/) v1.2 (Nov 19, 2026, 6:20 AM ET) - CC-203: insurance, business and real estate open their short forms; a form link with no known type opens the /order/ chooser, not the restaurant form. Earlier: v1.1 (Nov 16) CC-150 form and site links. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ClearPoint Media Group</title>
<!--
  CPMG click page for the CRM Call Tracker emails - v1.2 (Nov 19, 2026, 6:20 AM ET)
  A link in a CPMG tracker email opens this page. It quietly tells the sender script which email and which link,
  then opens the real page right away. The places it can open are fixed below (DEST and the FORM lists), so nobody
  can use it to send people anywhere else. (The mail merge keeps its own page, /go/. This one is separate on purpose.)
  LIVE version, staged for go-live (CC-150 step 6c). FORM_BASE must be the LIVE short form path that CC-144 puts live; check it before publishing.
  REVISION LOG
    v1.2 (Nov 19, 2026, 6:20 AM ET) CC-203: PACKS adds insurance, business and real-estate (now short forms at /order/<type>/). The form fallback, the Tap here button and the noscript link open the /order/ chooser instead of the restaurant form. EXEC and the other keys are unchanged.
    v1.1 (Nov 16, 2026, 1:20 AM ET) CC-150: new keys "form" and "site". form opens the short order form:
                       restaurant/?place=<Place>&look=<casual|upscale> when p is one of PLACES, or <pack>/?look=<look> when pk is one
                       of PACKS; anything else opens the plain form. site opens the More samples page. The old keys are unchanged.
    v1.0 (Nov 6, 2026) First version: web, order, instagram, facebook. Also sends a few robot clues (browser
                       says it is automated, screen size) so the tracker can tell robot clicks from people.
-->
<style>
body{font-family:Arial,Helvetica,sans-serif;text-align:center;padding:48px 16px;color:#1d2733;background:#f2f7f3}
a{display:inline-block;background:#1f7a43;color:#ffffff;padding:14px 26px;border-radius:6px;text-decoration:none;font-weight:bold;font-size:18px}
</style>
</head>
<body>
<p style="font-size:18px">Opening ClearPoint Media Group...</p>
<p><a id="go" href="https://clearpointmediagroup.github.io/order/">Tap here to continue</a></p>
<script>
(function () {
  var FORM_BASE = 'https://clearpointmediagroup.github.io/order/';
  var DEST = {
    web: 'https://sites.google.com/cpmgdata.com/cpmg',
    order: 'https://clearpointmediagroup.github.io/order/',
    instagram: 'https://www.instagram.com/clearpointmediagroup/',
    facebook: 'https://www.facebook.com/profile.php?id=61595065748576',
    site: 'https://clearpointmediagroup.github.io/site/',
    form: 'https://clearpointmediagroup.github.io/order/'   // CC-203: no known type = the /order/ chooser (was the restaurant form)
  };
  var PLACES = ['Pizza', 'Mexican', 'Italian', 'Chinese', 'Barbecue', 'Steakhouse', 'Seafood', 'Diner', 'Restaurant', 'Sports bar',
                'Dive bar', 'Cocktail bar', 'Tiki bar', 'Wine bar', 'Hotel and lodge'];
  var PACKS = ['brewery', 'cafe', 'outfitter', 'cabin', 'gift', 'spa', 'music', 'ski-bike', 'insurance', 'business', 'real-estate'];   // CC-203: + insurance, business, real estate (short forms)
  var EXEC = 'https://script.google.com/macros/s/AKfycbxWwbF0eQa_ebYCedk1xFJjxl_oKPHLng6CJLI0ZejFHACcOQ5Qy2AjKzsqwgj60sYb/exec';
  var q = new URLSearchParams(location.search);
  var k = q.get('k') || 'order';
  var dest = DEST[k] || DEST.order;
  if (k === 'form') {
    var look = q.get('l') === 'upscale' ? 'upscale' : (q.get('l') === 'casual' ? 'casual' : '');
    var p = q.get('p') || '', pk = q.get('pk') || '';
    if (PLACES.indexOf(p) !== -1) dest = FORM_BASE + 'restaurant/?place=' + encodeURIComponent(p) + (look ? '&look=' + look : '');
    else if (PACKS.indexOf(pk) !== -1) dest = FORM_BASE + pk + '/' + (look ? '?look=' + look : '');
  }
  document.getElementById('go').href = dest;
  var gone = false;
  function go() { if (gone) return; gone = true; location.replace(dest); }
  try {
    var i = q.get('i');
    if (i && window.fetch && EXEC.indexOf('https://script.google.com/') === 0) {
      var ua = navigator.userAgent || '';
      var bot = /Headless|PhantomJS|bot\b|crawl|spider|preview|Slurp|Lighthouse/i.test(ua) ? '1' : '0';
      var u = EXEC + '?x=1&i=' + encodeURIComponent(i) + '&lk=' + encodeURIComponent(k) +
              '&wd=' + (navigator.webdriver ? '1' : '0') + '&bt=' + bot +
              '&w=' + (screen.width || 0) + '&h=' + (screen.height || 0);
      fetch(u, { mode: 'no-cors', credentials: 'omit', keepalive: true }).then(go, go);
      setTimeout(go, 1500);
      return;
    }
  } catch (e) { /* counting failed; still open the page */ }
  go();
})();
</script>
<noscript><p><a href="https://clearpointmediagroup.github.io/order/">Tap here to continue</a></p></noscript>
</body>
</html>
